# ESFRI Research Infrastructures + EIROs, and Ireland's engagement with IENN.
#
# Source: "Mapping of ESFRI Research Infrastructures and Irish Membership
# Status" (Gavin Farrell, University of Limerick & ELIXIR-Ireland, v1,
# 3 Aug 2025), originally an appendix to the EOSC Ireland (v2) paper.
#
# tier:
#   engaged          - founding/active IENN grassroots forum member
#   to_be_onboarded  - Ireland has ESFRI membership/links, not yet in IENN
#   not_member       - Ireland is not a member of this ESFRI RI/EIRO
#
# roadmap_status (Project | Landmark) and site_structure (Distributed |
# Single-sited) come from the ESFRI Roadmap 2021 catalogue
# (https://roadmap2021.esfri.eu/projects-and-landmarks/view-the-table/).
# DISCLAIMER: that roadmap is from 2021 and may be out of date for newer
# or since-reclassified infrastructures — treat these two fields as
# indicative, not authoritative, and null for EIROs (not an ESFRI
# classification). Distributed infrastructures are the ones where Ireland
# could realistically host a node/outstation, which is why this matters
# for IENN specifically.
#
# website/logo/email are left null where not yet verified — filled in as a
# follow-up research pass, not guessed.

